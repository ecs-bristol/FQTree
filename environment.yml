name: fqtree
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip>=23
  - make
  - verilator
  - numpy
  - pandas
  - scikit-learn
  - jupyterlab
  - ipykernel
  - pip:
      - qxgb>=0.1.0
      - alkaid
      - xgboost>=3
      - -e .[notebooks]

# Vivado/Vitis remain external FPGA synthesis tools. Verilator is installed
# in this conda environment for RTL simulation via RTLModel.predict().
