name: fqtree
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip>=23
  - numpy
  - pandas
  - scikit-learn
  - jupyterlab
  - ipykernel
  - pip:
      - qxgb>=0.1.0
      - alkaid
      - xgboost>=3
      - -e .[notebooks]

# FPGA synthesis/simulation tools such as Vivado and Verilator are external
# toolchain dependencies and are not installed by this conda environment.
