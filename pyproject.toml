[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=67.8", "setuptools-scm>=8"]

[project]
name = "fqtree"
description = "FQTree: fine-grained quantization-aware boosted decision trees for FPGA deployment"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GNU Lesser General Public License v3 (LGPLv3)" }
authors = [{ name = "FQTree authors" }]
keywords = ["boosted decision trees", "fpga", "quantization", "xgboost"]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dynamic = ["version"]
dependencies = [
  "alkaid",
  "numpy",
  "qxgb>=0.1.0",
  "scikit-learn",
  "xgboost>=3",
]

[project.optional-dependencies]
notebooks = ["jupyter"]

[project.urls]
Repository = "https://github.com/ecs-bristol/FQTree"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
write_to = "src/fqtree/_version.py"

[tool.ruff]
target-version = "py310"
line-length = 100
